<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario simple · Orbe Apps</title>
<meta name="description" content="Cuánto tienes de cada producto, qué se vende más y un aviso cuando algo está por acabarse.">
<meta name="theme-color" content="#6a5cf2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../base/app.css">
<style>:root { --c: #6a5cf2; --c-ink: #fff; } @media (prefers-color-scheme: dark) { :root { --c: #8f84ff; --c-ink: #0b0a14; } }
.stock { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.stock .n { min-width: 46px; text-align: center; font: 800 17px var(--display); font-variant-numeric: tabular-nums; }
.stock .n small { display: block; font: 700 10.5px var(--body); color: var(--muted); }
.paso { width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--surface2); font: 800 19px/1 var(--body); display: grid; place-items: center; }
.paso:active { transform: scale(.94); }
.fila.prod { cursor: pointer; }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.grande { font: 800 40px/1 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.mov { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.mov:last-child { border-bottom: 0; } .mov span:first-child { flex: 1; } .mov small { color: var(--muted); }
.acciones2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.aviso-bajo { margin-top: 16px; display: flex; gap: 12px; align-items: center; background: color-mix(in srgb, var(--mal) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--mal) 28%, transparent); border-radius: 18px; padding: 12px 12px 12px 16px; font-size: 14px; font-weight: 700; }
.aviso-bajo span { flex: 1; }
.aviso-bajo .btn { padding: 10px 14px; font-size: 13.5px; }</style>
</head>
<body>
<header class="barra" id="barra"></header>
<main class="envoltura">
  <div class="prueba" id="prueba" hidden></div>
  <div class="resumen" id="resumen"></div>
  <div class="aviso-bajo" id="bajo" hidden></div>
  <label class="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="buscar" type="search" placeholder="Buscar producto" aria-label="Buscar producto"></label>
  <div class="pestanas" id="filtros"></div>
  <section class="seccion"><div class="lista" id="lista"></div></section>
  <p class="marca-pie">Hecha por <a href="https://orbe7apps.github.io/orbe-negocios/servicios/" target="_blank" rel="noopener">Orbe Apps</a></p>
</main>
<button class="btn principal fab" id="nuevo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Agregar producto</button>
<script src="../base/app.js"></script>
<script src="inventario.js"></script>
</body>
</html>
