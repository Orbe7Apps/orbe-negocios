<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de citas · Orbe Apps</title>
<meta name="description" content="Tus citas del día en orden, recordatorios por WhatsApp y un link para que tus clientas pidan cita.">
<meta name="theme-color" content="#f6f6f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500">
<link rel="stylesheet" href="../base/app.css">
<style>:root { --c: #0f766e; --c-ink: #fff; }
.dias-tira { margin-top: 14px; }
.dia { flex: 0 0 50px; border: 1px solid var(--borde); background: var(--card); border-radius: 12px; padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: background .2s, border-color .2s; }
.dia small { font-size: 10.5px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.dia b { font: 500 18px/1.2 var(--mono); letter-spacing: -.03em; }
.dia i { font-style: normal; width: 5px; height: 5px; border-radius: 50%; background: var(--c); font-size: 0; overflow: hidden; }
.dia[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); } .dia[aria-pressed="true"] small { color: inherit; opacity: .65; } .dia[aria-pressed="true"] i { background: var(--paper); }</style>
</head>
<body>
<header class="barra" id="barra"></header>
<main class="envoltura">
  <div class="demo" id="demo" hidden></div>
  <div id="vista"></div>
  <p class="marca-pie">Hecha por <a href="https://orbe7apps.github.io/orbe-negocios/apps/" target="_blank" rel="noopener">Orbe Apps</a></p>
</main>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<button class="fab" id="fab" type="button" aria-label="Nueva cita"></button>
<script src="../base/app.js"></script>
<script src="agenda.js"></script>
</body>
</html>
