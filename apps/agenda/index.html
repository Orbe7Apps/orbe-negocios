<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de citas · Orbe Apps</title>
<meta name="description" content="Tus citas del día en orden, recordatorios por WhatsApp y un enlace para que tus clientas pidan cita.">
<meta name="theme-color" content="#0f9d6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../base/app.css">
<style>:root { --c: #0f9d6b; --c-ink: #fff; } @media (prefers-color-scheme: dark) { :root { --c: #3ddc9f; --c-ink: #06261a; } }
.dias { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 16px -16px 0; padding: 2px 16px 4px; scroll-snap-type: x proximity; }
.dias::-webkit-scrollbar { display: none; }
.dia { flex: 0 0 58px; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; scroll-snap-align: start; }
.dia small { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.dia b { font: 800 20px var(--display); }
.dia i { width: 6px; height: 6px; border-radius: 50%; background: transparent; margin-top: 2px; }
.dia.con i { background: var(--c); }
.dia.cerrado { opacity: .5; }
.dia[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dia[aria-pressed="true"] small { color: inherit; opacity: .7; }
.cita { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 18px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; }
.cita .hora { font: 800 17px var(--display); min-width: 54px; font-variant-numeric: tabular-nums; }
.cita .hora small { display: block; font: 700 11.5px var(--body); color: var(--muted); }
.cita .info { flex: 1; min-width: 0; } .cita .info b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cita .info span { font-size: 13px; color: var(--muted); }
.cita.hecha { border-left-color: var(--line); opacity: .65; } .cita.cancelada { border-left-color: var(--mal); opacity: .5; } .cita.cancelada b { text-decoration: line-through; }
.libre { border: 1px dashed var(--line); background: none; border-radius: 14px; padding: 9px 14px; display: flex; gap: 12px; align-items: center; color: var(--muted); font-weight: 700; font-size: 14px; width: 100%; text-align: left; }
.libre .hora { min-width: 54px; font-variant-numeric: tabular-nums; }
.libre:hover { border-color: var(--c); color: var(--c); }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.acciones2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.serv { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); } .serv:last-child { border: 0; } .serv span { flex: 1; } .serv small { color: var(--muted); }
.enlace-caja { word-break: break-all; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; color: var(--muted); max-height: 90px; overflow: hidden; }</style>
</head>
<body>
<header class="barra" id="barra"></header>
<main class="envoltura">
  <div class="prueba" id="prueba" hidden></div>
  <div class="resumen" id="resumen"></div>
  
  <div class="dias" id="dias"></div>
  <section class="seccion"><div class="seccion-cab"><h2 id="titulo-dia"></h2><button class="enlace" type="button" id="btn-link">Link para reservar</button></div><div class="lista" id="lista"></div></section>
  <p class="marca-pie">Hecha por <a href="https://orbe7apps.github.io/orbe-negocios/servicios/" target="_blank" rel="noopener">Orbe Apps</a></p>
</main>
<button class="btn principal fab" id="nuevo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Nueva cita</button>
<script src="../base/app.js"></script>
<script src="agenda.js"></script>
</body>
</html>
