<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda de citas · Orbe Apps</title>
<meta name="description" content="Tus citas del día en orden, recordatorios por WhatsApp y un link para que tus clientas pidan cita.">
<meta name="theme-color" content="#12a37a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../base/app.css">
<style>:root { --c: #12a37a; --c-ink: #fff; } @media (prefers-color-scheme: dark) { :root { --c: #3ddc9f; --c-ink: #06261a; } }
.dias-tira { margin-top: 14px; }
.dia { flex: 0 0 54px; border: 1.5px solid transparent; background: var(--surface); border-radius: 18px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; box-shadow: var(--sombra); transition: border-color .3s var(--spring), background .3s; }
.dia small { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.dia b { font-size: 19px; font-weight: 700; line-height: 1.2; }
.dia i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--c-ink); background: var(--c); border-radius: 99px; min-width: 17px; padding: 0 4px; line-height: 15px; text-align: center; }
.dia[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }</style>
</head>
<body>
<header class="barra" id="barra"></header>
<main class="envoltura">
  <div class="demo" id="demo" hidden></div>
  <div id="vista"></div>
  <p class="marca-pie">Hecha por <a href="https://orbe7apps.github.io/orbe-negocios/apps/" target="_blank" rel="noopener">Orbe Apps</a></p>
</main>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<button class="fab" id="fab" type="button" aria-label="Nueva cita"></button>
<script src="../base/app.js"></script>
<script src="agenda.js"></script>
</body>
</html>
